<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sharpshooter Arena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#0b0e14;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;justify-content:space-around;padding:14px;background:#151a24;border-bottom:2px solid #f39c12}
.v{font-size:22px;font-weight:bold;color:#f39c12;text-align:center}
.l{font-size:11px;color:#aaa;text-align:center}
#arena{position:relative;flex:1;width:100%;overflow:hidden}
.t{position:absolute;width:74px;height:74px;border-radius:50%;background:radial-gradient(#e74c3c 25%,#fff 26%,#fff 50%,#c0392b 51%);display:flex;justify-content:center;align-items:center;transform:translate(-50%,-50%)}
.h{width:26px;height:26px;border-radius:50%;background:#f1c40f;border:2px solid #000}
.ov{position:fixed;inset:0;background:rgba(11,14,20,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;z-index:99}
.btn{background:#f39c12;color:#fff;border:none;padding:16px 30px;font-size:18px;font-weight:bold;border-radius:10px;margin:10px;width:250px}
.gold{background:#f1c40f;color:#000}
</style>
</head>
<body>
<div id="hud">
<div><div class="l">SCORE</div><div class="v" id="sc">0</div></div>
<div><div class="l">TIME</div><div class="v" id="tm">30s</div></div>
</div>
<div id="arena"></div>

<div id="s1" class="ov">
<h1 style="color:#f39c12;margin-bottom:10px">🎯 SHARPSHOOTER</h1>
<p style="color:#ccc;margin-bottom:20px">Yellow center par tap karke HEADSHOT (100 pts) maarein!</p>
<button class="btn" onclick="go(1)">🔥 Start Free Match</button>
<button class="btn gold" onclick="go(2)">⚡ Golden Gun (2x)</button>
</div>

<div id="s2" class="ov" style="display:none">
<h1 style="color:#f39c12">MATCH OVER!</h1>
<p style="font-size:22px;margin:15px 0">Score: <b id="fs" style="color:#f39c12">0</b></p>
<button class="btn" onclick="go(1)">🔄 Play Again</button>
<button class="btn gold" onclick="go(2)">⚡ Golden Gun (2x)</button>
</div>

<script>
var sc=0,tm=30,m=1,t1,t2;
function go(mode){
m=mode;sc=0;tm=30;
document.getElementById('sc').innerText=0;
document.getElementById('tm').innerText='30s';
document.getElementById('arena').innerHTML='';
document.getElementById('s1').style.display='none';
document.getElementById('s2').style.display='none';
clearInterval(t1);clearInterval(t2);
t1=setInterval(function(){
tm--;document.getElementById('tm').innerText=tm+'s';
if(tm<=0){clearInterval(t1);clearInterval(t2);document.getElementById('arena').innerHTML='';document.getElementById('fs').innerText=sc;document.getElementById('s2').style.display='flex';}
},1000);
t2=setInterval(sp,700);sp();
}
function sp(){
var a=document.getElementById('arena'),d=document.createElement('div'),b=document.createElement('div');
d.className='t';b.className='h';d.appendChild(b);
d.style.left=Math.max(40,Math.random()*(a.clientWidth-80))+'px';
d.style.top=Math.max(40,Math.random()*(a.clientHeight-80))+'px';
d.onclick=function(e){
e.stopPropagation();
sc+=(e.target.className==='h'?100:50)*m;
document.getElementById('sc').innerText=sc;
d.remove();
};
a.appendChild(d);
setTimeout(function(){if(d.parentNode)d.remove();},1400);
}
</script>
</body>
</html>
