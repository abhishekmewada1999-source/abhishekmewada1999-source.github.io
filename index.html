<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sharpshooter Arena</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid #f39c12;
            z-index: 10;
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 11px; color: #aaa; text-transform: uppercase; }
        .stat-val { font-size: 20px; font-weight: bold; color: #f39c12; }
        #arena {
            position: relative;
            flex: 1;
            width: 100%;
            cursor: crosshair;
            overflow: hidden;
        }
        .target {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #e74c3c 20%, #fff 21%, #fff 40%, #e74c3c 41%, #fff 60%, #c0392b 61%);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%) scale(0);
            animation: popIn 0.2s forwards;
            cursor: pointer;
        }
        .headshot-zone {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #f1c40f;
            border: 2px solid #000;
        }
        @keyframes popIn {
            to { transform: translate(-50%, -50%) scale(1); }
        }
        .float-text {
            position: absolute;
            font-weight: 900;
            font-size: 22px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 2px 2px 4px #000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -120%) scale(1.3); }
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 10, 15, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }
        h1 { font-size: 32px; color: #f39c12; margin-bottom: 10px; letter-spacing: 1px; }
        p { color: #ccc; max-width: 320px; margin-bottom: 20px; line-height: 1.4; }
        .btn {
            background: linear-gradient(45deg, #f39c12, #d35400);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            width: 240px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-gold {
            background: linear-gradient(45deg, #f1c40f, #b7950b);
            color: #000;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);
        }
        .hidden { display: none !important; }
        .golden-mode { box-shadow: inset 0 0 40px rgba(241, 196, 15, 0.5); }
    </style>
</head>
<body>
    <div id="hud">
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div class="stat-val" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Best</div>
            <div class="stat-val" id="best-score">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Time</div>
            <div class="stat-val" id="timer">30s</div>
        </div>
    </div>

    <div id="arena"></div>

    <div id="start-screen" class="overlay">
        <h1>🎯 SHARPSHOOTER ARENA</h1>
        <p>Center (Yellow) par shoot karke <b>HEADSHOT (2x Points)</b> maarein aur stress bhagayein!</p>
        <button class="btn" onclick="startGame(false)">🔥 Start Free Match</button>
        <button class="btn btn-gold" onclick="startGame(true)">⚡ Golden Gun (2x Points)</button>
    </div>

    <div id="gameover-screen" class="overlay hidden">
        <h1 id="result-title">BOOYAH! MATCH OVER</h1>
        <p style="font-size: 20px; color: #fff;">Final Score: <b id="final-score" style="color:#f39c12;">0</b></p>
        <p style="font-size: 14px;">Headshots: <span id="headshot-count">0</span></p>
        <button class="btn" onclick="startGame(false)">🔄 Play Again</button>
        <button class="btn btn-gold" onclick="startGame(true)">⚡ Play with Golden Gun</button>
    </div>

    <script>
        let score = 0;
        let bestScore = localStorage.getItem('sharpshooter_best') || 0;
        let headshots = 0;
        let timeLeft = 30;
        let gameInterval, spawnInterval;
        let isGoldenGun = false;

        const arena = document.getElementById('arena');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const timerEl = document.getElementById('timer');
        bestScoreEl.innerText = bestScore;

        let audioCtx = null;
        function playShootSound(isHeadshot) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = isHeadshot ? 'triangle' : 'sawtooth';
                osc.frequency.setValueAtTime(isHeadshot ? 800 : 250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function startGame(golden) {
            isGoldenGun = golden;
            score = 0;
            headshots = 0;
            timeLeft = 30;
            scoreEl.innerText = score;
            timerEl.innerText = timeLeft + "s";
            arena.innerHTML = "";

            if (isGoldenGun) {
                arena.classList.add('golden-mode');
            } else {
                arena.classList.remove('golden-mode');
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');

            gameInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft + "s";
                if (timeLeft <= 0) endGame();
            }, 1000);

            spawnInterval = setInterval(spawnTarget, 750);
            spawnTarget();
        }

        function spawnTarget() {
            const target = document.createElement('div');
            target.className = 'target';
            const bullseye = document.createElement('div');
            bullseye.className = 'headshot-zone';
            target.appendChild(bullseye);

            const maxX = Math.max(100, arena.clientWidth - 80);
            const maxY = Math.max(100, arena.clientHeight - 80);
            const randomX = Math.max(40, Math.floor(Math.random() * maxX));
            const randomY = Math.max(40, Math.floor(Math.random() * maxY));

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';

            target.onmousedown = target.ontouchstart = function(e) {
                e.preventDefault();
                e.stopPropagation();
                const isHeadshot = e.target.classList.contains('headshot-zone');
                let points = isHeadshot ? 100 : 50;
                if (isGoldenGun) points *= 2;

                score += points;
                if (isHeadshot) headshots++;
                scoreEl.innerText = score;

                playShootSound(isHeadshot);
                showFloatingText(randomX, randomY, isHeadshot ? `HEADSHOT! +${points}` : `+${points}`, isHeadshot ? '#f1c40f' : '#2ecc71');
                target.remove();
            };

            arena.appendChild(target);
            setTimeout(() => { if (target.parentNode) target.remove(); }, 1400);
        }

        function showFloatingText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = color;
            el.innerText = text;
            arena.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            arena.innerHTML = "";
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('sharpshooter_best', bestScore);
                bestScoreEl.innerText = bestScore;
            }
            document.getElementById('final-score').innerText = score;
